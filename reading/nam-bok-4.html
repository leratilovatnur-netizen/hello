<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading with Karolin</title><link rel="stylesheet" href="karolin.css?v=nb4"></head><body><div class="wrap"><section class="hero"><div class="small">READING WITH KAROLIN · LIRE · READ · LEER</div><h1>Jack London — Nam-Bok the Unveracious</h1><div id="meta" class="small"></div></section><div class="tabs"><button class="tab active" data-lang="en">🇬🇧 English</button><button class="tab" data-lang="fr">🇫🇷 Français</button><button class="tab" data-lang="es">🇪🇸 Español</button></div><section class="card"><div id="audioLabel" class="label"></div><button id="playBtn" class="btn"></button><button id="stopBtn" class="btn">■ Stop</button><audio id="audioPlayer" controls></audio></section><section class="card"><div id="readLabel" class="label"></div><div id="reader" class="reader"></div><details><summary id="ruSummary"></summary><div id="ruText"></div></details></section><section class="card"><div id="vocabLabel" class="label"></div><div id="vocabGrid" class="vocab"></div></section><section class="card"><div id="questionLabel" class="label"></div><div id="questions"></div></section><section class="card"><div class="label">Repeat · Speak · Reflection</div><div id="practiceBlock"></div></section></div><script src="nam-bok-part4-data.js?v=1"></script><script>let lang='en',i=0,on=false;const A=document.getElementById('audioPlayer');function lab(){return lang==='fr'?['Lire','Vocabulaire','Compréhension','🇷🇺 Afficher la traduction russe','Réponse modèle','Lecture littéraire']:lang==='es'?['Leer','Vocabulario','Comprensión','🇷🇺 Mostrar traducción rusa','Respuesta modelo','Lectura literaria']:['Read','Vocabulary','Comprehension','🇷🇺 Show Russian translation','Model answer','Literary reading']}function word(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang==='fr'?'fr-FR':lang==='es'?'es-ES':'en-US';u.rate=.82;speechSynthesis.speak(u)}function hi(n){document.querySelectorAll('.sentence').forEach((x,k)=>x.classList.toggle('on',k===n))}function stop(){on=false;i=0;hi(-1);A.pause();A.removeAttribute('src');A.load();if(window.speechSynthesis)speechSynthesis.cancel()}function next(){let d=NAMBOK4[lang];if(!on||i>=d.audio.length){on=false;hi(-1);return}hi(i);A.src=d.audio[i++];A.onended=next;A.play().catch(()=>{})}function play(){stop();on=true;next()}function render(){stop();let d=NAMBOK4[lang],l=lab();meta.textContent='Part 4 / 8 · '+d.title+' · B1–B2';audioLabel.textContent=l[5];playBtn.textContent='▶ '+l[5]+' · Part 4';readLabel.textContent=l[0];reader.innerHTML=d.text.map(x=>'<p class="sentence">'+x+'</p>').join('');ruSummary.textContent=l[3];ruText.innerHTML=NAMBOK4.ru.map(x=>'<p>'+x+'</p>').join('');vocabLabel.textContent=l[1]+' · '+d.words.length;vocabGrid.innerHTML=d.words.map(x=>'<div class="v"><button class="sound">🔊</button><div class="vtxt"><b>'+x[0]+'</b><span>'+x[1]+'</span><em>'+x[2]+'</em></div></div>').join('');[...document.querySelectorAll('.sound')].forEach((b,k)=>b.onclick=()=>word(d.words[k][0]));questionLabel.textContent=l[2];questions.innerHTML=d.qs.map(x=>'<div class="q"><b>'+x[0]+'</b><details><summary>'+(lang==='fr'?'Voir la réponse':lang==='es'?'Ver respuesta':'Show answer')+'</summary><div>'+x[1]+'</div></details></div>').join('');practiceBlock.innerHTML='<p><b>Repeat</b></p><ul>'+d.repeat.map(x=>'<li>'+x+'</li>').join('')+'</ul><p><b>Speak</b><br>'+d.speak+'</p><details><summary>'+l[4]+'</summary><p>'+d.model+'</p></details><p><b>Reflection</b><br>'+d.reflection+'</p>';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});playBtn.onclick=play;stopBtn.onclick=stop;render();</script></body></html>
