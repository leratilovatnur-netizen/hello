<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nam-Bok Part 5</title><link rel="stylesheet" href="karolin.css?v=nb5"></head><body><div class="wrap"><section class="hero"><div class="small">READING WITH KAROLIN · LIRE · READ · LEER</div><h1>Jack London — Nam-Bok the Unveracious</h1><div id="meta" class="small"></div></section><div class="tabs"><button class="tab active" data-lang="en">🇬🇧 English</button><button class="tab" data-lang="fr">🇫🇷 Français</button><button class="tab" data-lang="es">🇪🇸 Español</button></div><section class="card"><div id="audioLabel" class="label"></div><button id="playBtn" class="btn"></button><button id="stopBtn" class="btn">■ Stop</button><audio id="audioPlayer" controls></audio></section><section class="card"><div id="readLabel" class="label"></div><div id="reader" class="reader"></div><details><summary id="ruSummary"></summary><div id="ruText"></div></details></section><section class="card"><div id="vocabLabel" class="label"></div><div id="vocabGrid" class="vocab"></div></section><section class="card"><div id="questionLabel" class="label"></div><div id="questions"></div></section><section class="card"><div class="label">Repeat · Speak · Reflection</div><div id="practiceBlock"></div></section></div><script>const D={ru:['Нам-Бок рассказывал о железе, машинах, огромных домах и многолюдных улицах.','Он говорил, что яркие лампы превращают ночь в день. Для жителей деревни всё это звучало невероятно, и они начали сомневаться.'],en:{title:'Iron & Sun',text:['Nam-Bok tried to explain the strange world he had seen. He spoke of iron everywhere: iron tools, iron machines, iron rails. He told them of houses so large that many families could live inside them, and of streets crowded with people from morning until night.','The villagers listened in silence. Nam-Bok told them that men made iron move without hands and that bright lamps could turn night into day. To his people, these things sounded more impossible than spirits or magic, and their faces grew doubtful.'],words:[['iron','железо','iron everywhere'],['a machine','машина','iron machines'],['a rail','рельс','iron rails'],['crowded','переполненный','crowded streets'],['a lamp','лампа','bright lamps'],['to doubt','сомневаться','grew doubtful']],qs:[['What amazed Nam-Bok?','Iron, machines and artificial light.'],['Why did the villagers doubt him?','Because his story was beyond their experience.']],repeat:['There was iron everywhere.','The lamps turned night into day.','They began to doubt him.'],speak:'Retell Part 5 in 3–4 sentences.',model:'Nam-Bok describes iron, machines, huge houses and artificial light. The villagers cannot imagine such things and begin to doubt him.',reflection:'Why does technology sound like magic to the villagers?',audio:['https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e35d86dc-28d2-4b97-b837-67558ba4ceaa.mp3','https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/10e8419d-5f0a-4b58-ba35-73c90c72e54a.mp3']},fr:{title:'Le fer et le soleil',text:['Nam-Bok essaya d’expliquer le monde étrange qu’il avait découvert. Il parla du fer partout : des outils, des machines et des rails. Il raconta qu’il existait des maisons immenses et des rues remplies de monde.','Les villageois écoutaient en silence. Nam-Bok leur dit que les hommes faisaient avancer le fer et que des lampes brillantes pouvaient transformer la nuit en jour. Pour son peuple, ces choses semblaient impossibles, et le doute grandissait.'],words:[['le fer','железо','du fer partout'],['une machine','машина','des machines'],['un rail','рельс','des rails'],['bondé','переполненный','des rues bondées'],['une lampe','лампа','des lampes brillantes'],['douter','сомневаться','le doute grandissait']],qs:[['Qu’est-ce qui étonne Nam-Bok ?','Le fer, les machines et la lumière artificielle.'],['Pourquoi les villageois doutent-ils ?','Parce que ces choses dépassent leur expérience.']],repeat:['Il y avait du fer partout.','Les lampes transformaient la nuit en jour.','Ils commencèrent à douter.'],speak:'Racontez la Partie 5 en 3–4 phrases.',model:'Nam-Bok décrit le fer, les machines, de grandes maisons et la lumière artificielle. Les villageois n’arrivent pas à imaginer tout cela et commencent à douter.',reflection:'Pourquoi la technologie ressemble-t-elle à de la magie ?',audio:['https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/fb32b612-bb67-4d8c-bb87-48cdc70806b9.mp3','https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/227cc121-f73f-4077-82c3-22470e4e0828.mp3']},es:{title:'El hierro y el sol',text:['Nam-Bok intentó explicar el extraño mundo que había conocido. Habló de hierro por todas partes: herramientas, máquinas y raíles. Contó que había casas enormes y calles llenas de gente.','Los habitantes escuchaban en silencio. Nam-Bok les dijo que los hombres hacían moverse el hierro y que unas lámparas brillantes podían convertir la noche en día. Para su pueblo, aquello parecía imposible, y creció la duda.'],words:[['el hierro','железо','hierro por todas partes'],['una máquina','машина','máquinas'],['un raíl','рельс','raíles'],['abarrotado','переполненный','calles abarrotadas'],['una lámpara','лампа','lámparas brillantes'],['dudar','сомневаться','creció la duda']],qs:[['¿Qué sorprendía a Nam-Bok?','El hierro, las máquinas y la luz artificial.'],['¿Por qué dudaban los habitantes?','Porque aquello superaba su experiencia.']],repeat:['Había hierro por todas partes.','Las lámparas convertían la noche en día.','Empezaron a dudar.'],speak:'Cuenta la Parte 5 en 3–4 frases.',model:'Nam-Bok describe hierro, máquinas, casas enormes y luz artificial. Los habitantes no pueden imaginar todo eso y empiezan a dudar.',reflection:'¿Por qué la tecnología parece magia?',audio:['https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/79dbb806-67f0-4ed5-affc-a922bed880e6.mp3','https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b1bebb72-5ba1-4623-a326-6e8d32484d2c.mp3']}};let lang='en',idx=0,reading=false;function L(){return lang==='fr'?{r:'Lire',v:'Vocabulaire',q:'Compréhension',s:'🇷🇺 Afficher la traduction russe',m:'Réponse modèle',a:'Lecture littéraire'}:lang==='es'?{r:'Leer',v:'Vocabulario',q:'Comprensión',s:'🇷🇺 Mostrar traducción rusa',m:'Respuesta modelo',a:'Lectura literaria'}:{r:'Read',v:'Vocabulary',q:'Comprehension',s:'🇷🇺 Show Russian translation',m:'Model answer',a:'Literary reading'}}function speakWord(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='fr'?'fr-FR':lang==='es'?'es-ES':'en-US';u.rate=.82;speechSynthesis.speak(u)}function clearHi(){document.querySelectorAll('.sentence.on').forEach(x=>x.classList.remove('on'))}function hi(i){clearHi();document.querySelectorAll('.sentence')[i]?.classList.add('on')}function stop(){reading=false;idx=0;clearHi();audioPlayer.pause();audioPlayer.removeAttribute('src');audioPlayer.load();if(speechSynthesis)speechSynthesis.cancel()}function next(){const d=D[lang];if(!reading||idx>=d.audio.length){reading=false;clearHi();return}hi(idx);audioPlayer.src=d.audio[idx++];audioPlayer.play().catch(()=>{});audioPlayer.onended=next}function play(){stop();reading=true;next()}function render(){stop();const d=D[lang],l=L();meta.textContent=`Part 5 / 8 · ${d.title} · B1–B2`;audioLabel.textContent=l.a;playBtn.textContent=`▶ ${l.a} · Part 5`;readLabel.textContent=l.r;reader.innerHTML=d.text.map(x=>`<p class="sentence">${x}</p>`).join('');ruSummary.textContent=l.s;ruText.innerHTML=D.ru.map(x=>`<p>${x}</p>`).join('');vocabLabel.textContent=`${l.v} · ${d.words.length}`;vocabGrid.innerHTML=d.words.map(([w,m,e])=>`<div class="v"><button class="sound" onclick='speakWord(${JSON.stringify(w)})'>🔊</button><div class="vtxt"><b>${w}</b><span>${m}</span><em>${e}</em></div></div>`).join('');questionLabel.textContent=l.q;questions.innerHTML=d.qs.map(([q,a])=>`<div class="q"><b>${q}</b><details><summary>${lang==='fr'?'Voir la réponse':lang==='es'?'Ver respuesta':'Show answer'}</summary><div>${a}</div></details></div>`).join('');practiceBlock.innerHTML=`<p><b>Repeat</b></p><ul>${d.repeat.map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Speak</b><br>${d.speak}</p><details><summary>${l.m}</summary><p>${d.model}</p></details><p><b>Reflection</b><br>${d.reflection}</p>`;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});playBtn.onclick=play;stopBtn.onclick=stop;render();</script></body></html>
