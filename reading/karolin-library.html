<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading with Karolin</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3efe6;color:#1d1d1d}.library{padding:18px 20px;background:#fff;border-bottom:1px solid #ddd}.brand{font-size:13px;letter-spacing:.13em;color:#7a6852}.title{font-size:26px;font-weight:700;margin:5px 0 14px}.books{display:flex;gap:8px;flex-wrap:wrap}.books button{border:1px solid #cbbda8;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.books button.active{background:#2f4f4f;color:white;border-color:#2f4f4f}.books button:disabled{opacity:.5;cursor:default}iframe{display:block;width:100%;height:calc(100vh - 150px);border:0;background:#fff}</style></head><body><div class="library"><div class="brand">READING WITH KAROLIN · LIRE · READ · LEER</div><div class="title">Jack London — Reading Library</div><div class="books"><button id="b1" class="active">1 · Love of Life</button><button id="b2">2 · Nam-Bok the Unveracious</button><button id="b3">3 · The White Silence</button><button disabled>4 · The One Thousand Dozen</button><button disabled>5 · To Build a Fire</button><button disabled>6 · Brown Wolf</button></div></div><iframe id="book" src="karolin-final.html?v=bf3da30"></iframe><script>const frame=document.getElementById('book'),buttons=[...document.querySelectorAll('.books button')];function openBook(btn,src){frame.src=src;buttons.forEach(b=>b.classList.remove('active'));btn.classList.add('active')}b1.onclick=()=>openBook(b1,'karolin-final.html?v=bf3da30');b2.onclick=()=>openBook(b2,'nam-bok-book.html?v=d007f59');b3.onclick=()=>openBook(b3,'white-silence-1.html?v=ws1');</script></body></html>
